services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    image: echox-call:stream-cuda
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./docs:/app/docs
      - ./third_party:/app/third_party

  api:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    image: echox-call:stream-cuda
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./docs:/app/docs
      - ./third_party:/app/third_party

  worker:
    image: echox-call:stream-cuda
    gpus: all
    environment:
      POSTCALL_DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./docs:/app/docs
      - ./third_party:/app/third_party

  llm-worker:
    image: echox-call:stream-cuda
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./docs:/app/docs
      - ./third_party:/app/third_party

  console:
    image: echox-call:stream-cuda
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./docs:/app/docs
      - ./third_party:/app/third_party
